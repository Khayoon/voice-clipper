[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-clipper"
version = "0.2.0"
description = "A VLC-powered player for collecting, reviewing and exporting speech clips"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "soundcard>=0.4.3,<1", "soundfile>=0.12,<1", "keyboard>=0.13.5,<1"]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7", "python-vlc>=3.0.21203,<4"]
vocals = ["demucs>=4,<5", "soxr>=0.5,<2"]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
voice-clipper = "voiceclipper.gui:main"

[tool.setuptools]
packages = ["voiceclipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
